model_config:
  task: state_prediction
  glm_tokenizer_path: /root/SoulX-stage3-dataset/pretrained_models/glm-4-voice-tokenizer
  model_name: /root/SoulX-stage3-dataset/pretrained_models/Qwen3-0.6B-expand_vocab_v2
  init_ckpt_path: /root/SoulX-stage3-dataset/pretrained_models/SoulX-Duplug/SoulX-Duplug-0.6B-Bilingual.pth
  init_ckpt_path_lora: ""
  enable_lora: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  enable_projector: true
  freeze_projector: false
  llm_dim: 1024

dataset_config:
  train_data_path: /root/autodl-tmp/dataset/duplexconv/splits/edu0001_0045_stage3_zh_v2_seed42_group98_2_balanced_ci_v1/data/train.parquet
  validation_data_path: /root/autodl-tmp/dataset/duplexconv/splits/edu0001_0045_stage3_zh_v2_seed42_group98_2_balanced_ci_v1/data/validation.parquet
  split_manifest_path: /root/autodl-tmp/dataset/duplexconv/splits/edu0001_0045_stage3_zh_v2_seed42_group98_2_balanced_ci_v1/split_manifest.json
  batch_size: 1
  num_workers: 0
  max_token_length: 1500

train_config:
  stage: train
  total_steps: 30
  total_epochs: 0
  learning_rate: 1.0e-4
  min_lr: 1.0e-6
  warmup_steps: 200
  anneal_steps: 100000
  anneal_rate: 0.5
  weight_decay: 0.01
  accumulate_grad_batches: 576
  num_gpu_per_node: 1
  num_node: 1
  strategy: auto
  precision: 16-mixed
  sync_batchnorm: false
  seed: 42
  log_every_n_steps: 1
  # 5,760 microbatches = 10 optimizer updates at accumulation 576.
  val_check_interval: 5760
  enable_ema: false
  enable_switch_loss_rate: true
  switch_loss_rate_label: fe
  text_loss_rate: 0.45
  eos_loss_rate: 0.08
  idle_loss_rate: 0.08
  nonidle_loss_rate: 0.09
  user_complete_loss_rate: 0.185
  user_incomplete_loss_rate: 0.185
  user_backchannel_loss_rate: 0.006
  origin_step_estimate: 1800
  continual_run_id: duplexconv-edu0001-0045-official-lightning-joint-balanced-v1
  continual_audit_dir: /root/autodl-tmp/dataset/duplexconv/training/edu0001_0045_official_continual_joint_balanced_v1
  continual_checkpoint_steps: [1, 2, 3, 5, 10, 20, 30]
  native_checkpoint_save_top_k: 0
  native_checkpoint_save_last: true
  ckpt_path: ""
  default_root_dir: /root/autodl-tmp/dataset/duplexconv/training/edu0001_0045_official_continual_joint_balanced_v1
  wandb_run_name: duplexconv-edu0001-0045-official-lightning-joint-balanced-v1
  wandb_save_dir: /root/autodl-tmp/dataset/duplexconv/training/edu0001_0045_official_continual_joint_balanced_v1/wandb
