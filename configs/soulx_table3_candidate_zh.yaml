# Frozen candidate protocol for Table 3 Chinese Easy Turn.
# The precision field is inherited by upstream configuration but is not used by
# its inference function; the audited runner records effective parameter dtypes.
model_config:
  task: state_prediction
  glm_tokenizer_path: /root/SoulX-stage3-dataset/pretrained_models/glm-4-voice-tokenizer
  model_name: /root/SoulX-stage3-dataset/pretrained_models/Qwen3-0.6B-expand_vocab_v2
  init_ckpt_path_lora: /root/SoulX-stage3-dataset/pretrained_models/SoulX-Duplug/SoulX-Duplug-0.6B-Bilingual.pth
  enable_lora: true
  lora_r: 32
  lora_alpha: 64
  enable_cascade_asr: true
  llm_dim: 1024

infer_config:
  seed: 42
  device: cuda
  precision: bf16
  max_wait_num: 5
  max_mistake_num: 5
  single_round: false
  input:
    chunk_size: 2560
    audio_back_size: 15360
    audio_ahead_size: 640
    sample_rate: 16000
    chunk_token_len_small: 2
  asr:
    model_name: paraformer
    language: zh
